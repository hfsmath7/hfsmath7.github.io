ath\">B\u003c/span> הוא מספר חיובי כלשהו. לא ידוע אילו מספרים נבחרו.","drawing":null,"parts":[{"label":"על איזו טענה אי אפשר להחליט אם היא נכונה בלי לדעת אילו מספרים נבחרו?","type":"choice","options":["\u003cspan class=\"math\">A\u003c/span> קטן מ־\u003cspan class=\"math\">B\u003c/span>","המספר הנגדי של \u003cspan class=\"math\">B\u003c/span> קטן מאפס","הערך המוחלט של \u003cspan class=\"math\">A\u003c/span> גדול מ־\u003cspan class=\"math\">B\u003c/span>","\u003cspan class=\"math\">A\u003c/span> קטן מאפס"],"answer":2,"explanation":"אם \u003cspan class=\"math\">A\u003c/span> הוא \u003cspan class=\"math\">−2\u003c/span> ו־\u003cspan class=\"math\">B\u003c/span> הוא \u003cspan class=\"math\">5\u003c/span>, הערך המוחלט של \u003cspan class=\"math\">A\u003c/span> קטן מ־\u003cspan class=\"math\">B\u003c/span>. אם \u003cspan class=\"math\">A\u003c/span> הוא \u003cspan class=\"math\">−8\u003c/span> ו־\u003cspan class=\"math\">B\u003c/span> הוא \u003cspan class=\"math\">5\u003c/span>, הוא גדול ממנו. לכן חסר מידע על הטענה הזאת. שלוש הטענות האחרות נכונות לכל מספר שלילי ולכל מספר חיובי."}],"skill":"הבחנה בין מסקנה ודאית למידע חסר"}]}</script>
<script>
'use strict';
const EXAM=JSON.parse(document.getElementById('exam-data').textContent);
const $=id=>document.getElementById(id);
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plain=html=>{const d=document.createElement('div');d.innerHTML=html;return d.textContent;};
const fmt=n=>String(n).replace(/-/g,'−');
const key=`local-math-exam-v${EXAM.revision||1}-${EXAM.number}`;
const fresh=()=>({started:true,finished:false,index:0,answers:EXAM.questions.map(q=>q.parts.map(()=>null))});
let state=fresh(),showAll=false,storageWorks=true,dialogAction=null,previousFocus=null;
function validSaved(p,v){if(v===null)return true;if(p.type==='number'||p.type==='linepoint')return typeof v==='string';if(p.type==='point')return Array.isArray(v)&&v.length===2&&v.every(x=>typeof x==='string');if(p.type==='multi')return Array.isArray(v)&&new Set(v).size===v.length&&v.every(x=>Number.isInteger(x)&&x>=0&&x<p.options.length);return Number.isInteger(v)&&v>=0&&v<p.options.length;}
try{const saved=JSON.parse(localStorage.getItem(key));if(saved&&typeof saved.started==='boolean'&&typeof saved.finished==='boolean'&&Number.isInteger(saved.index)&&saved.index>=0&&saved.index<10&&Array.isArray(saved.answers)&&saved.answers.length===10&&saved.answers.every((a,i)=>Array.isArray(a)&&a.length===EXAM.questions[i].parts.length&&a.every((v,j)=>validSaved(EXAM.questions[i].parts[j],v))))state=saved;}catch(e){storageWorks=false;}
state.started=true;
if(!state.finished)state.index=0;
function save(){try{localStorage.setItem(key,JSON.stringify(state));storageWorks=true;}catch(e){storageWorks=false;}storageMessage();}
function storageMessage(){$('storage-status').hidden=storageWorks;$('storage-status').textContent=storageWorks?'':'לא ניתן לשמור התקדמות בדפדפן הזה. אפשר לפתור כרגיל, אך יש להשאיר את החלון פתוח עד הסיום.';}
function parseNumber(raw){if(typeof raw!=='string')return NaN;const s=raw.trim().replace(/−/g,'-').replace(/,/g,'.');const n='[+-]?(?:\\d+(?:\\.\\d*)?|\\.\\d+)';if(new RegExp('^'+n+'$').test(s))return Number(s);if(new RegExp('^'+n+'\\s*/\\s*'+n+'$').test(s)){const [a,b]=s.split('/').map(Number);return b===0?NaN:a/b;}return NaN;}
function isAnswered(p,v){if(p.type==='number'||p.type==='linepoint')return Number.isFinite(parseNumber(v));if(p.type==='point')return Array.isArray(v)&&v.length===2&&v.every(x=>Number.isFinite(parseNumber(x)));if(p.type==='multi')return Array.isArray(v)&&v.length>0&&validSaved(p,v);return Number.isInteger(v)&&v>=0&&v<p.options.length;}
function correct(p,v){if(!isAnswered(p,v))return false;if(p.type==='number'||p.type==='linepoint')return Math.abs(parseNumber(v)-p.answer)<1e-8;if(p.type==='point')return v.every((x,i)=>Math.abs(parseNumber(x)-p.answer[i])<1e-8);if(p.type==='multi')return v.length===p.answer.length&&p.answer.every(x=>v.includes(x));return v===p.answer;}
function answeredParts(i){return EXAM.questions[i].parts.filter((p,j)=>isAnswered(p,state.answers[i][j])).length;}
function grade(){let score=0,fullyCorrect=0,missing=0;const rows=EXAM.questions.map((q,i)=>{const results=q.parts.map((p,j)=>{const good=correct(p,state.answers[i][j]);if(good)score+=10/q.parts.length;if(!isAnswered(p,state.answers[i][j]))missing++;return good;});if(results.every(Boolean))fullyCorrect++;return results;});return {score:Math.round(score*100)/100,fullyCorrect,missing,rows};}
function svgOpen(viewBox,label,cls=''){return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${viewBox}" class="${cls}" role="img" aria-label="${esc(label)}"><title>${esc(label)}</title>`;}
function txt(x,y,label,cls='',extra=''){return `<text x="${x}" y="${y}" text-anchor="middle" class="${cls}" ${extra}>${esc(label)}</text>`;}
function line(x1,y1,x2,y2,cls='geometry'){return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${cls}"/>`;}
function arc(cx,cy,r,a1,a2,label){const point=a=>[cx+r*Math.cos(a),cy+r*Math.sin(a)];let diff=a2-a1;while(diff>Math.PI)diff-=2*Math.PI;while(diff<=-Math.PI)diff+=2*Math.PI;const p=point(a1),q=point(a1+diff),mid=a1+diff/2,lr=r+16;return `<path d="M${p[0]} ${p[1]} A${r} ${r} 0 0 ${diff>0?1:0} ${q[0]} ${q[1]}" class="arc"/>`+txt(cx+lr*Math.cos(mid),cy+lr*Math.sin(mid)+5,label,'arc-label');}
function drawing(d){if(!d)return '';let s='';
 if(d.kind==='numberline'){const X=x=>40+(x-d.min)/(d.max-d.min)*560;s=svgOpen('0 0 640 140','ציר מספרים במרווחים שווים, ועליו נקודות מסומנות');s+=line(22,72,620,72,'axis')+'<path d="M610 67 L620 72 L610 77" fill="none" stroke="#62758c"/>';const n=Math.round((d.max-d.min)/d.step);for(let i=0;i<=n;i++){const x=Math.round((d.min+i*d.step)*10000)/10000;s+=line(X(x),66,X(x),78,'axis');if(!d.labels||d.labels.includes(x))s+=txt(X(x),105,fmt(x));}for(const p of d.points||[])s+=`<circle cx="${X(p.x)}" cy="72" r="5.5" class="point"/>`+txt(X(p.x),46,p.label,'point-label');s+='</svg>';}
 if(d.kind==='rays'){const cx=240,cy=180,L=135;s=svgOpen('0 0 480 350','שרטוט קרניים וזוויות מסומנות');for(const p of d.rays){const a=-p.angle*Math.PI/180;s+=line(cx,cy,cx+L*Math.cos(a),cy+L*Math.sin(a));s+=txt(cx+(L+22)*Math.cos(a),cy+(L+22)*Math.sin(a)+6,p.name,'point-label');}for(const a of d.arcs||[])s+=arc(cx,cy,a.radius||48,-a.from*Math.PI/180,-a.to*Math.PI/180,a.label);s+=`<circle cx="${cx}" cy="${cy}" r="3" class="point"/>`+txt(cx,cy+25,d.vertex,'point-label');s+='</svg>';}
 if(d.kind==='triangle'){const points=Object.fromEntries(d.points.map(p=>[p.name,p]));s=svgOpen('0 0 480 320',d.description||'משולש, נקודה על צלע וקטע פנימי עם זוויות מסומנות');for(const [a,b]of d.segments){const p=points[a],q=points[b];s+=line(p.x,p.y,q.x,q.y);}for(const a of d.arcs||[]){const p=points[a.vertex],f=points[a.from],t=points[a.to];s+=arc(p.x,p.y,a.radius||30,Math.atan2(f.y-p.y,f.x-p.x),Math.atan2(t.y-p.y,t.x-p.x),a.label);}const center={x:d.points.slice(0,3).reduce((a,p)=>a+p.x,0)/3,y:d.points.slice(0,3).reduce((a,p)=>a+p.y,0)/3};for(const p of d.points){let vx=p.x-center.x,vy=p.y-center.y,len=Math.hypot(vx,vy)||1;const dx=p.labelDx??vx/len*18,dy=p.labelDy??vy/len*18;s+=`<circle cx="${p.x}" cy="${p.y}" r="3" class="point"/>`+txt(p.x+dx,p.y+dy+5,p.name,'point-label');}s+='</svg>';}
 if(d.kind==='grid'){
  const context=Boolean(d.contextualAxes),size=330,x0=context?100:65,y0=375,X=x=>x0+x/d.maxX*size,Y=y=>y0-y/d.maxY*size,right=x0+size+25;
  s=svgOpen(context?'0 0 490 450':'0 0 460 450','מערכת צירים עם שנתות ונקודות מסומנות','coordinate-grid');
  for(let x=0;x<=d.maxX;x+=d.step){s+=line(X(x),Y(0),X(x),Y(d.maxY),'grid');s+=txt(X(x),y0+23,String(x));}
  for(let y=0;y<=d.maxY;y+=d.step){s+=line(X(0),Y(y),X(d.maxX),Y(y),'grid');if(y)s+=txt(x0-22,Y(y)+5,String(y));}
  s+=line(x0-10,y0,right,y0,'axis')+line(x0,y0+10,x0,25,'axis')+`<path d="M${right-10} 370 L${right} 375 L${right-10} 380 M${x0-5} 35 L${x0} 25 L${x0+5} 35" stroke="#62758c" fill="none"/>`;
  if(context){
   if(d.xLabel)s+=txt(x0+size/2,435,d.xLabel,'context-axis-title');
   if(d.yLabel)s+=txt(25,210,d.yLabel,'context-axis-title','transform="rotate(-90 25 210)"');
  }else{
   s+=txt(435,y0+5,'x')+txt(x0,18,'y');
   if(d.xLabel)s+=txt(245,435,d.xLabel,'','style="direction:rtl;font-size:15px"');
   if(d.yLabel)s+=txt(230,18,d.yLabel,'','style="direction:rtl;font-size:15px"');
  }
  const points=Object.fromEntries(d.points.map(p=>[p.label,p]));
  for(const [a,b]of d.segments||[]){const p=points[a],q=points[b];s+=line(X(p.x),Y(p.y),X(q.x),Y(q.y));}
  for(const p of d.points){s+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="5" class="point"/>`+txt(X(p.x)+(p.dx??12),Y(p.y)+(p.dy??-11),p.label,context?'point-label person-label':'point-label');}
  s+='</svg>';
 }
 if(d.kind==='schematic'){
  s=svgOpen('0 0 480 350','מלבן במערכת צירים: הצלע התחתונה בגובה y=1 והצלע העליונה בשיעור לא ידוע. השרטוט ללא קנה מידה');
  s+=line(65,300,450,300,'axis')+line(65,300,65,25,'axis');
  s+='<path d="M440 295 L450 300 L440 305 M60 35 L65 25 L70 35" stroke="#62758c" fill="none"/>';
  s+=txt(465,306,'x')+txt(65,16,'y')+txt(49,321,'0');
  s+='<path d="M65 70 H135 M65 250 H135" stroke="#9aaec7" stroke-width="1.4" stroke-dasharray="5 4" fill="none"/>';
  s+=line(60,70,70,70,'axis')+line(60,250,70,250,'axis');
  s+='<rect x="135" y="70" width="260" height="180" fill="#edf3ff" stroke="#225bd5" stroke-width="2.6"/>';
  s+=txt(265,167,d.insideLabel,'','style="direction:rtl"')+txt(265,279,d.widthLabel,'','style="direction:rtl"')+txt(29,76,d.topLabel)+txt(29,256,d.bottomLabel);s+='</svg>';
 }
 return `<div class="visual">${s}</div>`+(['rays','triangle','schematic'].includes(d.kind)?'<p class="diagram-note">השרטוט להמחשה; החישוב לפי הנתונים.</p>':'');
}
function updateProgress(){const full=EXAM.questions.filter((q,i)=>answeredParts(i)===q.parts.length).length;$('question-progress').textContent=`שאלה ${state.index+1} מתוך 10`;$('answered-progress').textContent=`${full} מתוך 10 שאלות נענו במלואן`;$('progress-bar').style.width=`${full*10}%`;$('question-nav').replaceChildren();EXAM.questions.forEach((q,i)=>{const n=answeredParts(i),b=document.createElement('button');b.type='button';b.textContent=i+1;b.className=n===q.parts.length?'answered':n?'partial':'';b.setAttribute('aria-label',`שאלה ${i+1}, ${n===q.parts.length?'נענתה':n?'נענתה חלקית':'טרם נענתה'}`);if(i===state.index)b.setAttribute('aria-current','step');b.addEventListener('click',()=>go(i));$('question-nav').append(b);});}
function answer(j,value){if(state.finished)return;state.answers[state.index][j]=value;save();updateProgress();}
function renderQuestion(focus=true){
 const q=EXAM.questions[state.index];
 $('topic').textContent=q.topic;$('question-title').innerHTML=q.prompt;
 $('question-drawing').innerHTML=drawing(q.drawing);$('parts').replaceChildren();
 q.parts.forEach((p,j)=>{
  const field=document.createElement('fieldset');field.className='part';
  const legend=document.createElement('legend');legend.id=`label-${j}`;
  legend.innerHTML=(q.parts.length>1?`${['א','ב'][j]}. `:'')+p.label+`<span class="part-points">${10/q.parts.length} נקודות</span>`;field.append(legend);
  if(p.type==='choice'||p.type==='multi'){
   const multiple=p.type==='multi';
   if(multiple){const hint=document.createElement('p');hint.className='multi-instruction';hint.textContent='יש לסמן את כל התשובות הנכונות. הסעיף מזכה בניקוד רק אם נבחרו כולן, ללא תשובות נוספות.';field.append(hint);}
   const answers=document.createElement('div');answers.className='answers'+(p.optionDrawings?' with-diagrams':'');
   p.options.forEach((option,k)=>{
    const b=document.createElement('button');b.type='button';b.className='answer'+(multiple?' multiple':'')+(p.optionDrawings?' diagram-option':'');b.id=`answer-${j}-${k}`;
    const selected=multiple?(state.answers[state.index][j]||[]).includes(k):state.answers[state.index][j]===k;
    b.setAttribute('aria-pressed',String(selected));
    b.innerHTML=`<span class="letter" aria-hidden="true">${multiple?(selected?'✓':''):['א','ב','ג','ד','ה','ו'][k]}</span><span class="choice-value">${option}</span>`;
    if(p.optionDrawings)b.innerHTML+=`<span class="option-diagram">${drawing(p.optionDrawings[k]).match(/<svg[\s\S]*<\/svg>/)[0]}</span>`;
    b.addEventListener('click',()=>{
     if(multiple){const set=new Set(state.answers[state.index][j]||[]);set.has(k)?set.delete(k):set.add(k);answer(j,[...set].sort((a,b)=>a-b));}
     else answer(j,k);
     for(const [index,btn]of [...answers.children].entries()){
      const chosen=multiple?(state.answers[state.index][j]||[]).includes(index):index===k;
      btn.setAttribute('aria-pressed',String(chosen));if(multiple)btn.querySelector('.letter').textContent=chosen?'✓':'';
     }
    });answers.append(b);
   });field.append(answers);
  }else if(p.type==='point'){
   const hint=document.createElement('p');hint.className='placement-hint';hint.textContent='אפשר לסמן בלחיצה על מערכת הצירים, או להקליד את שני השיעורים. הסעיף נבדק לפי שני השיעורים יחד.';field.append(hint);
   const row=document.createElement('div');row.className='input-row point-controls';
   ['x','y'].forEach((axis,k)=>{
    const label=document.createElement('label');label.innerHTML=`<span>שיעור <span class="math">${axis}</span></span>`;
    const input=document.createElement('input');input.id=`answer-${j}-${axis}`;input.type='text';input.inputMode='decimal';input.dir='ltr';input.autocomplete='off';input.value=state.answers[state.index][j]?.[k]??'';
    input.addEventListener('input',()=>{const v=['x','y'].map(a=>$(`answer-${j}-${a}`).value);answer(j,v);updatePlacement(j);});label.append(input);row.append(label);
   });field.append(row);
   const output=document.createElement('output');output.id=`placement-status-${j}`;output.className='placement-status';output.setAttribute('aria-live','polite');field.append(output);
  }else{
   const row=document.createElement('div');row.className='input-row';
   const input=document.createElement('input');input.id=`answer-${j}`;input.type='text';input.inputMode='decimal';input.dir='ltr';input.autocomplete='off';input.setAttribute('aria-labelledby',legend.id);input.setAttribute('aria-describedby',`help-${j}`);input.value=state.answers[state.index][j]??'';
   input.addEventListener('input',()=>{answer(j,input.value);if(p.type==='linepoint')updatePlacement(j);});row.append(input);
   if(p.unit){const u=document.createElement('span');u.textContent=p.unit;row.append(u);}field.append(row);
   const help=document.createElement('p');help.id=`help-${j}`;help.className='number-help';help.textContent='יש להקליד מספר בלבד. אפשר להשתמש בסימן מינוס, בנקודה עשרונית או בשבר כגון 1/2.';field.append(help);
   if(p.type==='linepoint'){const output=document.createElement('output');output.id=`placement-status-${j}`;output.className='placement-status';output.setAttribute('aria-live','polite');field.append(output);}
  }
  $('parts').append(field);
 });
 const placement=q.parts.findIndex(p=>['point','linepoint'].includes(p.type));if(placement>=0)bindPlacement(placement);
 $('previous').disabled=state.index===0;$('next').hidden=state.index===9;$('finish').hidden=state.index!==9;updateProgress();
 if(focus){$('question-title').focus();window.scrollTo({top:0,behavior:'instant'});}
}
function placementCoords(j){const q=EXAM.questions[state.index],p=q.parts[j],v=state.answers[state.index][j];if(!isAnswered(p,v))return null;return p.type==='point'?v.map(parseNumber):[parseNumber(v)];}
function updatePlacement(j){
 const q=EXAM.questions[state.index],d=q.drawing,p=q.parts[j],svg=$('question-drawing').querySelector('svg'),value=placementCoords(j);
 svg.querySelector('.user-marker')?.remove();const output=$(`placement-status-${j}`);
 output.innerHTML=value?`הסימון שלך: <span class="math">${p.type==='point'?'('+value.map(fmt).join(', ')+')':fmt(value[0])}</span>`:'טרם סומנה נקודה.';
 if(!value)return;let x,y;
 if(p.type==='point'){if(value[0]<0||value[0]>d.maxX||value[1]<0||value[1]>d.maxY)return;x=(d.contextualAxes?100:65)+value[0]/d.maxX*330;y=375-value[1]/d.maxY*330;}
 else{if(value[0]<d.min||value[0]>d.max)return;x=40+(value[0]-d.min)/(d.max-d.min)*560;y=72;}
 svg.insertAdjacentHTML('beforeend',`<g class="user-marker" aria-hidden="true"><circle cx="${x}" cy="${y}" r="9" fill="#fff" stroke="#7a3cac" stroke-width="3"/><circle cx="${x}" cy="${y}" r="3" fill="#7a3cac"/></g>`);
}
function bindPlacement(j){
 const q=EXAM.questions[state.index],d=q.drawing,p=q.parts[j],svg=$('question-drawing').querySelector('svg');svg.classList.add('clickable-diagram');svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','אזור סימון נקודה. אפשר ללחוץ, להשתמש במקשי החצים או להקליד בשדות שמתחת לשרטוט.');
 const apply=coords=>{if(p.type==='point'){['x','y'].forEach((a,k)=>{$(`answer-${j}-${a}`).value=String(coords[k]);});answer(j,coords.map(String));}else{$(`answer-${j}`).value=String(coords[0]);answer(j,String(coords[0]));}updatePlacement(j);};
 const clamp=(n,min,max)=>Math.min(max,Math.max(min,n)),snap=(n,step)=>Math.round(Math.round(n/step)*step*1e8)/1e8;
 svg.addEventListener('click',event=>{
  const pt=new DOMPoint(event.clientX,event.clientY).matrixTransform(svg.getScreenCTM().inverse());
  if(p.type==='point'){const x0=d.contextualAxes?100:65;if(pt.x<x0-8||pt.x>x0+338||pt.y<37||pt.y>383)return;apply([clamp(snap((pt.x-x0)/330*d.maxX,d.snap||1),0,d.maxX),clamp(snap((375-pt.y)/330*d.maxY,d.snap||1),0,d.maxY)]);}
  else{if(pt.x<32||pt.x>608)return;apply([clamp(snap(d.min+(pt.x-40)/560*(d.max-d.min),d.step),d.min,d.max)]);}
 });
 svg.addEventListener('keydown',event=>{
  if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key))return;event.preventDefault();
  const v=placementCoords(j)||(p.type==='point'?[0,0]:[clamp(0,d.min,d.max)]),delta=event.key==='ArrowLeft'||event.key==='ArrowDown'?-1:1;
  if(p.type==='point'){const axis=event.key==='ArrowLeft'||event.key==='ArrowRight'?0:1;v[axis]=clamp(v[axis]+delta*(d.snap||1),0,axis===0?d.maxX:d.maxY);}
  else v[0]=clamp(v[0]+delta*d.step,d.min,d.max);apply(v);
 });updatePlacement(j);
}

function go(i){state.index=i;save();renderQuestion();}
function show(){document.title=EXAM.title+' · מתמטיקה לכיתה ז׳';$('title').textContent=EXAM.title;$('quiz').hidden=state.finished;$('results').hidden=!state.finished;storageMessage();if(state.finished)renderResults();else renderQuestion(false);}
function answerHtml(p,v){
 if(v===null||v===''||(Array.isArray(v)&&v.length===0))return 'לא נענתה';
 if(p.type==='choice')return p.options[v]??'לא נענתה';
 if(p.type==='multi')return '<span class="answer-list">'+v.map(i=>'<span>'+p.options[i]+'</span>').join('')+'</span>';
 if(p.type==='point')return '<span class="math">('+v.map(x=>x===''?'?':esc(x)).join(', ')+')</span>';
 return '<span class="math">'+esc(v)+'</span>'+(p.unit?' '+esc(p.unit):'');
}
function solutionHtml(p){
 if(p.type==='choice')return p.options[p.answer];
 if(p.type==='multi')return '<span class="answer-list">'+p.answer.map(i=>'<span>'+p.options[i]+'</span>').join('')+'</span>';
 if(p.type==='point')return '<span class="math">('+p.answer.map(fmt).join(', ')+')</span>';
 return '<span class="math">'+fmt(p.answer)+'</span>'+(p.unit?' '+esc(p.unit):'');
}
function renderResults(){const g=grade();$('score-value').textContent=g.score;$('result-summary').textContent=`${g.fullyCorrect} מתוך 10 שאלות נענו נכון במלואן. ניתן ניקוד גם על סעיפים נכונים.`+(g.missing?` ${g.missing} סעיפים לא נענו או מולאו באופן לא תקין.`:'');$('review-title').textContent=showAll?'כל השאלות והפתרונות':'הטעויות והסברים לתיקון';$('toggle-review').textContent=showAll?'הצגת הטעויות בלבד':'הצגת כל הפתרונות';$('toggle-review').setAttribute('aria-pressed',String(showAll));let content='';EXAM.questions.forEach((q,i)=>{if(!showAll&&g.rows[i].every(Boolean))return;const points=g.rows[i].filter(Boolean).length*10/q.parts.length;content+=`<article class="card review"><h3>שאלה ${i+1} · ${esc(q.topic)} <span class="part-points">${points} מתוך 10 נקודות</span></h3><div class="prompt">${q.prompt}</div>${drawing(q.drawing)}`;q.parts.forEach((p,j)=>{const good=g.rows[i][j];content+=`<div class="review-part ${good?'correct':'wrong'}"><p><strong>${q.parts.length>1?['א','ב'][j]+'. ':''}${p.label}</strong></p><p class="${good?'good':'bad'}"><strong>${good?'✓ תשובה נכונה':'✕ יש לתקן'}</strong></p><p>התשובה שלך: ${answerHtml(p,state.answers[i][j])}</p>${good?'':`<p><strong>התשובה הנכונה: ${solutionHtml(p)}</strong></p>`}${p.optionDrawings?`<div class="review-option">${drawing(p.optionDrawings[p.answer])}</div>`:''}<p class="solution">${p.explanation}</p></div>`;});content+='</article>';});$('review-list').innerHTML=content||'<div class="card empty-review"><strong>כל התשובות נכונות — כל הכבוד!</strong><p>אפשר לעיין בכל הפתרונות באמצעות הכפתור למעלה.</p></div>';}
function closeDialog(){ $('dialog-overlay').hidden=true;document.body.classList.remove('modal-open');document.querySelector('main').inert=false;dialogAction=null;if(previousFocus)previousFocus.focus();}
function dialog(title,description,confirmLabel,action,cancelLabel='חזרה למבחן'){previousFocus=document.activeElement;dialogAction=action;$('dialog-title').textContent=title;$('dialog-description').textContent=description;$('dialog-confirm').textContent=confirmLabel;$('dialog-cancel').textContent=cancelLabel;$('dialog-overlay').hidden=false;document.body.classList.add('modal-open');document.querySelector('main').inert=true;$('dialog-cancel').focus();}
$('dialog-cancel').addEventListener('click',closeDialog);$('dialog-confirm').addEventListener('click',()=>{const a=dialogAction;closeDialog();if(a)a();});$('dialog-overlay').addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();closeDialog();}if(e.key==='Tab'){e.preventDefault();(document.activeElement===$('dialog-cancel')?$('dialog-confirm'):$('dialog-cancel')).focus();}});
$('previous').addEventListener('click',()=>go(Math.max(0,state.index-1)));$('next').addEventListener('click',()=>go(Math.min(9,state.index+1)));
$('finish').addEventListener('click',()=>{const missing=EXAM.questions.reduce((n,q,i)=>n+q.parts.length-answeredParts(i),0);dialog('לסיים את המבחן?',missing?`נותרו ${missing} סעיפים ללא תשובה תקינה. סעיפים אלה יקבלו 0 נקודות. אחרי הסיום יוצגו הציון והפתרונות ולא ניתן יהיה לשנות תשובות.`:'כל השאלות נענו. אחרי הסיום יוצגו הציון והפתרונות ולא ניתן יהיה לשנות תשובות.','סיום והצגת הציון',()=>{state.finished=true;save();show();$('result-title').focus();window.scrollTo({top:0,behavior:'instant'});});});
$('restart').addEventListener('click',()=>dialog('להתחיל מחדש?','התשובות והציון של הניסיון הנוכחי יימחקו מהקובץ הזה בדפדפן. ניתן להדפיס את התוצאות לפני שמתחילים שוב.','התחלה מחדש',()=>{state=fresh();showAll=false;save();show();$('question-title').focus();window.scrollTo({top:0,behavior:'instant'});},'חזרה לתוצאות'));
$('toggle-review').addEventListener('click',()=>{showAll=!showAll;renderResults();});$('print').addEventListener('click',()=>window.print());
show();
</script>
