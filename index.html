 if(d.reveal){const v=d.nodes[target.vertex];for(const [i,n] of [target.a,target.b].entries())out+=L(...v,...d.nodes[n],`stroke="${i?'#168163':'#225bd5'}" stroke-width="3.5"`);}
 for(const mark of d.marks){const v=d.nodes[mark.vertex],a=d.nodes[mark.a],b=d.nodes[mark.b],start=Math.atan2(a[1]-v[1],a[0]-v[0]),end=Math.atan2(b[1]-v[1],b[0]-v[0]);let delta=((end-start+3*Math.PI)%(2*Math.PI))-Math.PI;
  const radius=32,p=[v[0]+radius*Math.cos(start),v[1]+radius*Math.sin(start)],q=[v[0]+radius*Math.cos(start+delta),v[1]+radius*Math.sin(start+delta)],mid=start+delta/2,color=d.reveal&&mark===target?'#225bd5':'#62758c';
  out+=`<path d="M${p[0]} ${p[1]} A${radius} ${radius} 0 0 ${delta>0?1:0} ${q[0]} ${q[1]}" fill="none" stroke="${color}" stroke-width="2.1"/>`+T(v[0]+56*Math.cos(mid),v[1]+56*Math.sin(mid)+6,mark.greek,21,'style="font-family:Cambria Math,serif;font-style:italic;fill:'+color+'"');
 }
 const points=Object.values(d.nodes),cx=points.reduce((n,p)=>n+p[0],0)/points.length,cy=points.reduce((n,p)=>n+p[1],0)/points.length;
 for(const [name,p] of Object.entries(d.nodes)){const len=Math.hypot(p[0]-cx,p[1]-cy)||1;out+=C(...p,d.reveal&&name===target.vertex?'#c68722':'#344c68',3)+T(p[0]+20*(p[0]-cx)/len,p[1]+20*(p[1]-cy)/len+5,name,17);}
 return S(out,'צורה גאומטרית. הזוויות מסומנות בקשתות ובאותיות יווניות.',500,335);
}
function drawSchematic(d){
 let out=L(60,280,475,280,'class="axis"')+L(75,310,75,30,'class="axis"')+'<path d="M467 275L477 280L467 285M70 38L75 28L80 38" fill="none" stroke="#62758c"/>'+T(493,285,'x')+T(75,18,'y')+T(60,302,'0',14);
 out+=`<rect x="160" y="80" width="220" height="150" fill="${d.perimeter?'none':'#dceafd'}" stroke="${d.perimeterHighlight?'#168163':'#225bd5'}" stroke-width="${d.perimeterHighlight?4:2}"/>`;
 const center=d.centerLabel||d.perimeterLabel||d.areaLabel;if(center)out+=T(270,159,center,22);
 if(d.heightLabel)out+=T(445,160,d.heightLabel,19);
 if(d.widthLabel)out+=T(270,d.cornerLabels?212:253,d.widthLabel,18);
 for(const [field,x] of [['leftLabel',160],['rightLabel',380]])if(d[field])out+=L(x,230,x,280,'class="guide"')+T(x,311,d[field],17);
 for(const [field,y] of [['topLabel',80],['bottomLabel',230]])if(d[field])out+=L(75,y,160,y,'class="guide"')+T(35,y+5,d[field],17);
 if(d.cornerLabels)for(const [name,x,y,dy] of [['D',160,230,24],['E',380,230,24],['F',380,80,-16],['G',160,80,-16]])out+=C(x,y,d.highlightCorner===name||d.highlightCorners?.includes(name)?'#168163':'#225bd5')+T(x,y+dy,d.cornerLabels[name],18);
 return S(out,'מלבן במערכת צירים ללא משבצות.',520,335);
}
function diagram(d){if(!d)return '';switch(d.kind){case 'numberline':return drawLine(d);case 'plane':return drawPlane(d);case 'fan':return drawFan(d);case 'angle-scene':return drawAngleScene(d);case 'schematic-rectangle':return drawSchematic(d);default:throw Error('Unknown illustration');}}
function shuffle(values){const a=[...values];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const byTopic=Object.fromEntries(topicNames.map(t=>[t,Object.fromEntries(['easy','medium','hard'].map(l=>[l,bank.filter(q=>q.topic===t&&q.level===l)]))]));
const expectedAnswers=q=>q.correctValues||[q.correct];
const sameSet=(a,b)=>a.length===b.length&&a.every(v=>b.includes(v));
const mastery=Object.fromEntries(topicNames.map(t=>[t,0]));
const seen=Object.fromEntries(topicNames.map(t=>[t,{easy:new Set(),medium:new Set(),hard:new Set()}]));
let topicBag=[],previousTopic=null,current=null,choices=[],answered=false,previousId=null,selectedValue=null,selectedValues=[];
const progressKey='hfsmath7.practice.progress.v1';
const stats={answered:0,correct:0,topics:Object.fromEntries(topicNames.map(t=>[t,{answered:0,correct:0}]))};
const bankSignature=(()=>{let hash=2166136261;const source=bank.map(q=>q.id+expectedAnswers(q).join(',')+q.choices.map(o=>o.value).join('|')).join('\n');for(let i=0;i<source.length;i++)hash=Math.imul(hash^source.charCodeAt(i),16777619);return (hash>>>0).toString(16);})();
let restoredSolutionOpen=null;
function storageStatus(failed){$('storage-status').hidden=!failed;$('storage-status').textContent=failed?'לא ניתן לשמור התקדמות בדפדפן הזה.':'';}
function saveProgress(){
 if(!current)return;
 const state={schema:1,bankSignature,mastery,seen:Object.fromEntries(topicNames.map(t=>[t,Object.fromEntries(['easy','medium','hard'].map(l=>[l,[...seen[t][l]]]))])),topicBag,previousTopic,previousId,currentId:current.id,currentCorrect:current.correct,currentCorrectValues:expectedAnswers(current),choiceValues:choices.map(o=>o.value),answered,selectedValue,selectedValues,solutionOpen:answered&&$('solution').open,stats,updatedAt:new Date().toISOString()};
 try{window.localStorage.setItem(progressKey,JSON.stringify(state));storageStatus(false);}catch{storageStatus(true);}
}
function restoreProgress(){
 try{
  const raw=window.localStorage.getItem(progressKey);if(!raw)return false;const data=JSON.parse(raw);if(!data||data.schema!==1)return false;
  const count=v=>Number.isSafeInteger(v)&&v>=0?v:0;
  for(const t of topicNames){const score=data.mastery?.[t];if(Number.isFinite(score))mastery[t]=Math.min(6,Math.max(0,score));const old=data.stats?.topics?.[t];stats.topics[t].answered=count(old?.answered);stats.topics[t].correct=Math.min(stats.topics[t].answered,count(old?.correct));}
  stats.answered=Object.values(stats.topics).reduce((n,v)=>n+v.answered,0);stats.correct=Object.values(stats.topics).reduce((n,v)=>n+v.correct,0);
  const bankChanged=(data.bankSignature!==bankSignature&&!["4b6e4fd2"].includes(data.bankSignature));
  const q=bank.find(q=>q.id===data.currentId),values=data.choiceValues;
  if(!q||(q.multiple&&!Array.isArray(data.currentCorrectValues))||(Array.isArray(data.currentCorrectValues)&&!sameSet(data.currentCorrectValues,expectedAnswers(q)))||(data.currentCorrect!==undefined&&data.currentCorrect!==q.correct)||!Array.isArray(values)||values.length!==q.choices.length||new Set(values).size!==4||!values.every(v=>q.choices.some(o=>o.value===v)))return false;
  for(const t of topicNames)for(const l of ['easy','medium','hard']){const ids=data.seen?.[t]?.[l];if(Array.isArray(ids))seen[t][l]=new Set(ids.filter(id=>byTopic[t][l].some(q=>q.id===id)&&(!bankChanged||!byTopic[t][l].find(q=>q.id===id)?.revision)));}
  topicBag=Array.isArray(data.topicBag)?[...new Set(data.topicBag.filter(t=>topicNames.includes(t)))]:[];
  previousTopic=topicNames.includes(data.previousTopic)?data.previousTopic:q.topic;previousId=q.id;
  current=q;choices=values.map(v=>q.choices.find(o=>o.value===v));const pending=Array.isArray(data.selectedValues)?data.selectedValues:[data.selectedValue];selectedValues=[...new Set(pending.filter(v=>values.includes(v)))];answered=data.answered===true&&selectedValues.length>0;if(!q.multiple&&!answered)selectedValues=[];selectedValue=selectedValues[0]||null;restoredSolutionOpen=answered&&typeof data.solutionOpen==='boolean'?data.solutionOpen:null;
  return true;
 }catch{return false;}
}
function levelWeights(score){
 if(score<=0)return [1,0,0];
 if(score<2)return [.78,.22,0];
 if(score<3)return [.60,.34,.06];
 if(score<4)return [.43,.43,.14];
 if(score<5)return [.28,.48,.24];
 return [.16,.44,.40];
}
function pickLevel(topic){const w=levelWeights(mastery[topic]),r=Math.random();return r<w[0]?'easy':r<w[0]+w[1]?'medium':'hard';}
function chooseQuestion(){
 if(!topicBag.length){topicBag=shuffle(topicNames);if(topicBag.at(-1)===previousTopic)[topicBag[0],topicBag[topicBag.length-1]]=[topicBag.at(-1),topicBag[0]];}
 const topic=topicBag.pop(),level=pickLevel(topic),pool=byTopic[topic][level],used=seen[topic][level];
 let available=pool.filter(q=>!used.has(q.id));if(!available.length){used.clear();available=pool.filter(q=>q.id!==previousId);}
 const q=available[Math.floor(Math.random()*available.length)];used.add(q.id);previousTopic=topic;previousId=q.id;return q;
}
function presentQuestion(){
 $('question').innerHTML=current.prompt;$('context').innerHTML=current.context;$('context').hidden=!current.context;
 $('question-visual').innerHTML=diagram(current.drawing);$('question-visual').hidden=!current.drawing;
 $('selection-instruction').textContent=current.multiple?'סמנו את כל התשובות הנכונות.':'';$('selection-instruction').hidden=!current.multiple||current.prompt.includes('סמנו את כל');
 $('answers').innerHTML=choices.map((o,i)=>`<button class="answer${current.multiple?' multiple':''}" data-answer="${i}" ${current.multiple?'aria-pressed="false"':''}><span class="letter">${'אבגד'[i]}</span><span class="choice-value">${o.html}</span><span class="mark" aria-hidden="true"></span></button>`).join('');
 document.querySelectorAll('[data-answer]').forEach(el=>el.onclick=()=>answer(Number(el.dataset.answer)));
 $('feedback').hidden=true;$('solution').open=false;$('navigation').hidden=true;$('next').textContent='השאלה הבאה ←';
 $('submit-answer').hidden=!current.multiple;updateSelection();if(answered)showFeedback();
}
function updateSelection(){
 if(!current.multiple)return;
 document.querySelectorAll('[data-answer]').forEach((el,i)=>{const chosen=selectedValues.includes(choices[i].value);el.className='answer multiple'+(chosen?' selected':'');el.setAttribute('aria-pressed',String(chosen));el.querySelector('.mark').textContent=chosen?'✓':'';});
 $('submit-answer').disabled=!selectedValues.length;
}
function render(){current=chooseQuestion();choices=shuffle(current.choices);answered=false;selectedValue=null;selectedValues=[];presentQuestion();saveProgress();}
function showFeedback(){
 const expected=expectedAnswers(current),ok=sameSet(selectedValues,expected),chosen=choices.find(o=>selectedValues.includes(o.value));
 document.querySelectorAll('[data-answer]').forEach((el,i)=>{el.disabled=true;if(expected.includes(choices[i].value)){el.classList.add('correct');el.querySelector('.mark').textContent='✓';}else if(selectedValues.includes(choices[i].value)){el.classList.add('wrong');el.querySelector('.mark').textContent='✕';}});
 $('result').className='result '+(ok?'good':'bad');$('result').textContent=ok?'תשובה נכונה.':'תשובה שגויה.';
 let reason=chosen?.reason||'נבדוק את הנתונים ונפתור לפי הסדר.';
 if(current.multiple){const missing=expected.some(v=>!selectedValues.includes(v)),extra=selectedValues.some(v=>!expected.includes(v));reason=(missing?'לא סומנו כל התשובות הנכונות. ':'')+(extra?'סומנו גם תשובות שגויות.':'');}
 $('mistake').textContent=ok?'':reason;$('mistake').hidden=ok;
 $('steps').innerHTML=current.steps.map(s=>'<li>'+s+'</li>').join('');$('final-answer').innerHTML=current.final;
 $('widget-title').textContent=current.illustrationTitle;$('widget-description').textContent=current.illustrationDescription;$('widget-description').hidden=!current.illustrationDescription;
 $('widget-stage').innerHTML=diagram(current.illustration);$('solution').open=!ok;$('feedback').className='feedback'+(ok?' correct-answer':'');$('navigation').className='footer-nav'+(ok?' correct-answer':'');$('feedback').hidden=false;$('navigation').hidden=false;$('submit-answer').hidden=true;
}
function gradeSelection(){
 if(answered||!selectedValues.length)return;answered=true;const ok=sameSet(selectedValues,expectedAnswers(current));
 mastery[current.topic]=Math.max(0,Math.min(6,mastery[current.topic]+(ok?1:-1.5)));
 stats.answered++;stats.correct+=ok?1:0;stats.topics[current.topic].answered++;stats.topics[current.topic].correct+=ok?1:0;
 showFeedback();saveProgress();
}
function answer(index){
 if(answered||!choices[index])return;const value=choices[index].value;
 if(current.multiple){selectedValues=selectedValues.includes(value)?selectedValues.filter(v=>v!==value):[...selectedValues,value];selectedValue=selectedValues[0]||null;updateSelection();saveProgress();}
 else{selectedValues=[value];selectedValue=value;gradeSelection();}
}
function next(){if(!answered)return;render();$('question').focus();window.scrollTo({top:0,behavior:'instant'});}
$('next').onclick=next;$('submit-answer').onclick=gradeSelection;$('solution').ontoggle=saveProgress;
if(restoreProgress()){presentQuestion();if(restoredSolutionOpen!==null)$('solution').open=restoredSolutionOpen;saveProgress();}else render();

</script>
