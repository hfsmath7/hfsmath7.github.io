<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מבחנים</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh;padding:32px 20px;display:grid;place-items:center;background:#f5f7fa;font-family:Arial,"Segoe UI",sans-serif}
main{position:relative;width:min(100%,380px);display:grid;gap:12px}
nav{display:grid;gap:12px}
.mascot{position:absolute;bottom:calc(100% + 20px);left:50%;transform:translateX(-50%);width:172px;padding:0;border:0;border-radius:14px;background:transparent;cursor:pointer;touch-action:manipulation;transition:filter .15s}
.mascot img{display:block;width:100%;height:auto}
.mascot:hover{filter:drop-shadow(0 3px 3px #182d4915)}
.mascot:active{opacity:.7}
.mascot:focus-visible{outline:3px solid #225bd5;outline-offset:5px}
a{display:flex;align-items:center;justify-content:center;min-height:64px;padding:17px 24px;border:1px solid #e1e7ef;border-radius:14px;background:#fff;color:#243b58;font-size:20px;line-height:1.4;text-align:center;text-decoration:none;box-shadow:0 3px 12px #182d4905;transition:border-color .15s,box-shadow .15s,transform .15s}
a:last-child{margin-top:8px;background:#edf2fc;border-color:#d8e2f5;color:#225bd5}
a:hover{border-color:#a6bde4;box-shadow:0 5px 16px #182d490a;transform:translateY(-1px)}
a:focus-visible{outline:3px solid #225bd5;outline-offset:4px}
@media(max-height:700px){.mascot{position:static;transform:none;justify-self:center;width:140px;margin-bottom:8px}}
@media(prefers-reduced-motion:reduce){a,.mascot{transition:none}}
</style>
</head>
<body>
<main>
<button class="mascot" id="cat-button" type="button" aria-label="השמעת הצליל">
<img src="assets/cat-mascot.png" width="1619" height="971" alt="חתול" draggable="false">
</button>
<nav aria-label="בחירת תרגול">
<a href="מבחן-תרגול-1.html">מבחן תרגול 1</a>
<a href="מבחן-תרגול-2.html">מבחן תרגול 2</a>
<a href="מבחן-תרגול-3.html">מבחן תרגול 3</a>
<a href="מבחן-תרגול-4.html">מבחן תרגול 4</a>
<a href="infinite-practice.html">תרגול אינסופי</a>
</nav>
</main>
<audio id="cat-sound" src="assets/cat-wow.mp3" preload="auto"></audio>
<script>
const catSound=document.getElementById('cat-sound');
document.getElementById('cat-button').addEventListener('click',()=>{
  catSound.pause();
  catSound.currentTime=0;
  catSound.play().catch(()=>{});
});
</script>
</body>
</html>
