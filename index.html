}
function drawSchematic(d){
 const [x0,y0,x1,y1]=d.rect,ox=85,oy=300,scale=Math.min(330/(x1+1),240/(y1+1));
 const X=x=>ox+x*scale,Y=y=>oy-y*scale,left=X(x0),right=X(x1),top=Y(y1),bottom=Y(y0),cx=(left+right)/2,cy=(top+bottom)/2,ax=X(x1+1)+18,ay=Y(y1+1)-18;
 let out=L(ox-10,oy,ax,oy,'class="axis"')+L(ox,oy+12,ox,ay,'class="axis"')+`<path d="M${ax-8} ${oy-5}L${ax+2} ${oy}L${ax-8} ${oy+5}M${ox-5} ${ay+8}L${ox} ${ay-2}L${ox+5} ${ay+8}" fill="none" stroke="#62758c"/>`+T(ax+18,oy+5,'x')+T(ox,ay-12,'y')+T(ox-12,oy+23,'0',14);
 out+=`<rect x="${left}" y="${top}" width="${right-left}" height="${bottom-top}" fill="${d.perimeter?'none':'#dceafd'}" stroke="${d.perimeterHighlight?'#168163':'#225bd5'}" stroke-width="${d.perimeterHighlight?4:2}"/>`;
 const center=d.centerLabel||d.perimeterLabel||d.areaLabel;if(center){const split=center.split(':');out+=split.length===2?T(cx,cy-5,split[0],17)+T(cx,cy+17,split[1].trim(),18):T(cx,cy+6,center,18);}

 if(d.widthLabel)out+=T(cx,d.cornerLabels?bottom-12:bottom+24,d.widthLabel,18);
 for(const [field,x] of [['leftLabel',left],['rightLabel',right]])if(d[field])out+=L(x,bottom,x,oy,'class="guide"')+T(x,oy+28,d[field],17);
 for(const [field,y] of [['topLabel',top],['bottomLabel',bottom]])if(d[field])out+=L(ox,y,left,y,'class="guide"')+T(ox-42,y+5,d[field],17);
 if(d.cornerLabels)for(const [name,x,y,dy] of [['D',left,bottom,24],['E',right,bottom,24],['F',right,top,-16],['G',left,top,-16]])out+=C(x,y,d.highlightCorner===name||d.highlightCorners?.includes(name)?'#168163':'#225bd5')+T(x,y+dy,d.cornerLabels[name],18);

}
function learnedFacts(d){
 if(!d.learnedFacts?.length)return '';
 const angle='<svg class="angle-symbol" viewBox="0 0 30 30" role="img" aria-label="זווית"><path d="M3 23H26M3 23L23 3M13 3Q27 16 13 29"/></svg>';
 return '<ul class="learned-facts" aria-label="נתונים שכבר מצאנו">'+d.learnedFacts.map(fact=>{
  const rtl=/[\u0590-\u05ff]/.test(fact);let text=escapeText(fact).replace(/∠/g,angle);
  for(const [glyph,numerator,denominator] of [['¼',1,4],['½',1,2],['¾',3,4]])text=text.replaceAll(glyph,`<span class="fraction"><span>${numerator}</span><span>${denominator}</span></span>`);
  return `<li><span dir="${rtl?'rtl':'ltr'}"${rtl?'':' class="math"'}>${text}</span></li>`;
 }).join('')+'</ul>';
}
function diagram(d){
 if(!d)return '';let drawing;
 switch(d.kind){case 'panels':drawing=drawPanels(d);break;case 'numberline':drawing=drawLine(d);break;case 'plane':drawing=drawPlane(d);break;case 'fan':drawing=drawFan(d);break;case 'angle-scene':drawing=drawAngleScene(d);break;case 'schematic-rectangle':drawing=drawSchematic(d);break;default:throw Error('Unknown illustration');}
 return drawing+learnedFacts(d);
}
function drawPanels(d){
 return '<div class="panel-grid">'+d.panels.map(p=>`<figure><figcaption>שרטוט ${escapeText(p.label)}</figcaption>${diagram(p.drawing)}</figure>`).join('')+'</div>';
}
function planeMetrics(d){
 const all=[...d.points.map(p=>[p.x,p.y]),...(d.rect?[[d.rect[0],d.rect[1]],[d.rect[2],d.rect[3]]]:[]),...(d.path||[])],scale=d.scale||1;
 const nx=Math.ceil((d.maxX??d.extent?.[0]??Math.max(5*scale,...all.map(p=>p[0]+scale)))/scale),ny=Math.ceil((d.maxY??d.extent?.[1]??Math.max(5*scale,...all.map(p=>p[1]+scale)))/scale);
 return {scale,nx,ny,step:Math.min(320/nx,240/ny),ox:65,oy:290};
}
function placementValid(value,q=current){
 const a=q.interaction;if(!a)return false;
 const vals=a.kind==='plane'?value:[value];
 return Array.isArray(vals)&&vals.length===(a.kind==='plane'?2:1)&&vals.every(v=>typeof v==='number'&&Number.isFinite(v)&&v>=a.min&&v<=a.max&&Math.abs((v-a.min)/a.step-Math.round((v-a.min)/a.step))<1e-7);
}
function placementValue(){try{const value=JSON.parse(selectedValues[0]);return placementValid(value)?value:null;}catch{return null;}}
function placementText(value){return Array.isArray(value)?'('+value.map(numberText).join(', ')+')':numberText(value);}
function paintPlacement(){
 const value=placementValue(),d=JSON.parse(JSON.stringify(current.drawing));
 if(value!==null)d.points.push({x:Array.isArray(value)?value[0]:value,y:Array.isArray(value)?value[1]:0,label:current.interaction.label,color:answered?(sameSet(selectedValues,expectedAnswers(current))?'#168163':'#a52d46'):'#bf8122',labelDy:22,labelY:42});
 $('question-visual').innerHTML=diagram(d);
 $('placement-value').textContent=value===null?'טרם סומנה נקודה':current.interaction.label+' = '+placementText(value);
 $('submit-answer').disabled=value===null;
}
function setPlacement(value){
 if(answered||!placementValid(value))return false;
 selectedValue=JSON.stringify(value);selectedValues=[selectedValue];
 const v=Array.isArray(value)?value:[value];$('placement-x').value=v[0];if(v.length===2)$('placement-y').value=v[1];
 paintPlacement();saveProgress();return true;
}
function inputPlacement(){
 if(answered)return;
 const fields=current.interaction.kind==='plane'?[$('placement-x'),$('placement-y')]:[$('placement-x')];
 const vals=fields.map(el=>el.value.trim()===''?NaN:Number(el.value)),value=fields.length===2?vals:vals[0];
 if(!setPlacement(value)){selectedValue=null;selectedValues=[];paintPlacement();saveProgress();}
}
function setupPlacement(){
 const a=current.interaction,visual=$('question-visual');$('placement-controls').hidden=!a;
 visual.onclick=null;visual.onkeydown=null;visual.tabIndex=a?0:-1;
 if(!a){visual.removeAttribute('aria-label');return;}
 $('placement-x-label').textContent=a.kind==='plane'?(current.drawing.axisLabels?.x||'שיעור x'):'המיקום על הציר';
 $('placement-y-label').textContent=current.drawing.axisLabels?.y||'שיעור y';$('placement-y-wrap').hidden=a.kind!=='plane';
 for(const id of ['placement-x','placement-y']){const el=$(id);el.min=a.min;el.max=a.max;el.step=a.step;el.value='';el.disabled=answered;el.oninput=inputPlacement;}
 const value=placementValue();if(value!==null){$('placement-x').value=Array.isArray(value)?value[0]:value;if(Array.isArray(value))$('placement-y').value=value[1];}
 visual.setAttribute('aria-label','סימון הנקודה '+a.label+'. אפשר ללחוץ על השרטוט, להשתמש במקשי החצים או להזין את המיקום בשדות שמתחתיו.');
 const snap=v=>Math.round((Math.max(a.min,Math.min(a.max,v))-a.min)/a.step)*a.step+a.min;
 visual.onclick=event=>{
  if(answered)return;const svg=visual.querySelector('svg');if(!svg)return;
  const matrix=svg.getScreenCTM();if(!matrix)return;const p=svg.createSVGPoint();p.x=event.clientX;p.y=event.clientY;const hit=p.matrixTransform(matrix.inverse());
  if(a.kind==='numberline'){if(hit.x<35||hit.x>465||Math.abs(hit.y-105)>45)return;setPlacement(snap(current.drawing.lo+(hit.x-45)*(current.drawing.hi-current.drawing.lo)/410));}
  else {const m=planeMetrics(current.drawing),x=(hit.x-m.ox)*m.scale/m.step,y=(m.oy-hit.y)*m.scale/m.step;if(x<a.min-.35||x>a.max+.35||y<a.min-.35||y>a.max+.35)return;setPlacement([snap(x),snap(y)]);}

 visual.onkeydown=event=>{
  if(answered||!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End'].includes(event.key))return;
  event.preventDefault();let v=placementValue()??(a.kind==='plane'?[a.min,a.min]:snap(0));
  if(a.kind==='numberline'){if(event.key==='Home')v=a.min;else if(event.key==='End')v=a.max;else v=snap(v+(['ArrowRight','ArrowUp'].includes(event.key)?a.step:-a.step));}
  else {v=[...v];const i=['ArrowUp','ArrowDown'].includes(event.key)?1:0;if(event.key==='Home')v=[a.min,a.min];else if(event.key==='End')v=[a.max,a.max];else v[i]=snap(v[i]+(['ArrowRight','ArrowUp'].includes(event.key)?a.step:-a.step));}
  setPlacement(v);

}
function groupNext(q){return q?.group?bank.find(p=>p.group?.id===q.group.id&&p.group.index===q.group.index+1)||null:null;}

function shuffle(values){const a=[...values];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const byTopic=Object.fromEntries(topicNames.map(t=>[t,Object.fromEntries(['easy','medium','hard'].map(l=>[l,bank.filter(q=>q.topic===t&&q.level===l)]))]));
const expectedAnswers=q=>q.correctValues||[q.correct];
const sameSet=(a,b)=>a.length===b.length&&a.every(v=>b.includes(v));
const mastery=Object.fromEntries(topicNames.map(t=>[t,0]));
const easyCorrectStreak=Object.fromEntries(topicNames.map(t=>[t,0]));
const seen=Object.fromEntries(topicNames.map(t=>[t,{easy:new Set(),medium:new Set(),hard:new Set()}]));
let topicBag=[],previousTopic=null,current=null,choices=[],answered=false,previousId=null,selectedValue=null,selectedValues=[];
const progressKey='hfsmath7.practice.progress.v1';
const stats={answered:0,correct:0,topics:Object.fromEntries(topicNames.map(t=>[t,{answered:0,correct:0}]))};
const bankSignature=(()=>{let hash=2166136261;const source=bank.map(q=>q.id+expectedAnswers(q).join(',')+q.choices.map(o=>o.value).join('|')).join('\n');for(let i=0;i<source.length;i++)hash=Math.imul(hash^source.charCodeAt(i),16777619);return (hash>>>0).toString(16);})();
let restoredSolutionOpen=null;
function storageStatus(failed){$('storage-status').hidden=!failed;$('storage-status').textContent=failed?'לא ניתן לשמור התקדמות בדפדפן הזה.':'';}
function saveProgress(){
 if(!current)return;
 const state={schema:1,bankSignature,mastery,easyCorrectStreak,seen:Object.fromEntries(topicNames.map(t=>[t,Object.fromEntries(['easy','medium','hard'].map(l=>[l,[...seen[t][l]]]))])),topicBag,previousTopic,previousId,currentId:current.id,currentCorrect:current.correct,currentCorrectValues:expectedAnswers(current),choiceValues:choices.map(o=>o.value),answered,selectedValue,selectedValues,solutionOpen:answered&&$('solution').open,stats,updatedAt:new Date().toISOString()};
 try{window.localStorage.setItem(progressKey,JSON.stringify(state));storageStatus(false);}catch{storageStatus(true);}
}
function restoreProgress(){
 try{
  const raw=window.localStorage.getItem(progressKey);if(!raw)return false;const data=JSON.parse(raw);if(!data||data.schema!==1)return false;
  const count=v=>Number.isSafeInteger(v)&&v>=0?v:0;
  for(const t of topicNames){const score=data.mastery?.[t];if(Number.isFinite(score))mastery[t]=Math.min(6,Math.max(0,score));easyCorrectStreak[t]=Math.min(2,count(data.easyCorrectStreak?.[t]));const old=data.stats?.topics?.[t];stats.topics[t].answered=count(old?.answered);stats.topics[t].correct=Math.min(stats.topics[t].answered,count(old?.correct));}
  stats.answered=Object.values(stats.topics).reduce((n,v)=>n+v.answered,0);stats.correct=Object.values(stats.topics).reduce((n,v)=>n+v.correct,0);
  const bankChanged=(data.bankSignature!==bankSignature&&!["4b6e4fd2","e721c71f"].includes(data.bankSignature));
  const q=bank.find(q=>q.id===data.currentId),values=data.choiceValues;
  // Keep valid learning history even when a replaced question cannot be resumed.
  for(const t of topicNames)for(const l of ['easy','medium','hard']){const ids=data.seen?.[t]?.[l];if(Array.isArray(ids))seen[t][l]=new Set(ids.filter(id=>byTopic[t][l].some(q=>q.id===id)&&(!bankChanged||!byTopic[t][l].find(q=>q.id===id)?.revision)));}
  topicBag=Array.isArray(data.topicBag)?[...new Set(data.topicBag.filter(t=>topicNames.includes(t)))]:[];
  previousTopic=topicNames.includes(data.previousTopic)?data.previousTopic:q?.topic||null;previousId=q?.id||(bank.some(q=>q.id===data.previousId)?data.previousId:null);
  if(topicBag.at(-1)===previousTopic){const other=topicBag.findIndex(t=>t!==previousTopic);if(other<0)topicBag=[];else [topicBag[other],topicBag[topicBag.length-1]]=[topicBag.at(-1),topicBag[other]];}
  if(!q||(q.multiple&&!Array.isArray(data.currentCorrectValues))||(Array.isArray(data.currentCorrectValues)&&!sameSet(data.currentCorrectValues,expectedAnswers(q)))||(data.currentCorrect!==undefined&&data.currentCorrect!==q.correct)||!Array.isArray(values)||values.length!==q.choices.length||new Set(values).size!==q.choices.length||!values.every(v=>q.choices.some(o=>o.value===v)))return false;
  current=q;choices=values.map(v=>q.choices.find(o=>o.value===v));const pending=Array.isArray(data.selectedValues)?data.selectedValues:[data.selectedValue];selectedValues=[...new Set(pending.filter(v=>{if(!q.interaction)return values.includes(v);try{return placementValid(JSON.parse(v),q);}catch{return false;}}))].slice(0,q.multiple?q.choices.length:1);answered=data.answered===true&&selectedValues.length>0;if(!q.multiple&&!q.interaction&&!answered)selectedValues=[];selectedValue=selectedValues[0]||null;restoredSolutionOpen=answered&&typeof data.solutionOpen==='boolean'?data.solutionOpen:null;
  return true;
 }catch{return false;}
}
function levelWeights(score,easyStreak=0){
 const weights=score<=0?[1,0,0]:score<2?[.78,.22,0]:score<3?[.60,.34,.06]:score<4?[.43,.43,.14]:score<5?[.28,.48,.24]:[.16,.44,.40];
 // A topic's streak survives questions from other topics; favour medium after two easy successes.
 if(easyStreak>=2){const shift=weights[0]/2;weights[0]-=shift;weights[1]+=shift;}
 return weights;
}
function pickLevel(topic){const w=levelWeights(mastery[topic],easyCorrectStreak[topic]),r=Math.random();return r<w[0]?'easy':r<w[0]+w[1]?'medium':'hard';}
function chooseQuestion(){
 if(!topicBag.length){topicBag=shuffle(topicNames);if(topicBag.at(-1)===previousTopic)[topicBag[0],topicBag[topicBag.length-1]]=[topicBag.at(-1),topicBag[0]];}
 const topic=topicBag.pop(),level=pickLevel(topic),pool=byTopic[topic][level].filter(q=>!q.group||q.group.index===0),used=seen[topic][level];
 let available=pool.filter(q=>!used.has(q.id));if(!available.length){used.clear();available=pool.filter(q=>q.id!==previousId);}
 const q=available[Math.floor(Math.random()*available.length)];used.add(q.id);previousTopic=topic;previousId=q.id;return q;
}
function presentQuestion(){
 $('group-progress').hidden=!current.group;$('group-progress').textContent=current.group?current.group.title+' · סעיף '+(current.group.index+1)+' מתוך '+current.group.count:'';
 $('question').innerHTML=current.prompt;$('context').innerHTML=current.context;$('context').hidden=!current.context;
 $('question-visual').innerHTML=diagram(current.drawing);$('question-visual').hidden=!current.drawing;
 $('selection-instruction').textContent=current.interaction?'סמנו על השרטוט, או הזינו את המיקום בשדות למטה. אפשר גם להשתמש במקשי החצים כשהשרטוט ממוקד.':current.multiple?'סמנו את כל התשובות הנכונות.':'';$('selection-instruction').hidden=!current.interaction&&(!current.multiple||current.prompt.includes('סמנו את כל'));
 $('answers').innerHTML=choices.map((o,i)=>`<button class="answer${current.multiple?' multiple':''}" data-answer="${i}" ${current.multiple?'aria-pressed="false"':''}><span class="letter">${'אבגדהוזחט'[i]}</span><span class="choice-value">${o.html}</span><span class="mark" aria-hidden="true"></span></button>`).join('');
 document.querySelectorAll('[data-answer]').forEach(el=>el.onclick=()=>answer(Number(el.dataset.answer)));
 $('feedback').hidden=true;$('solution').open=false;$('navigation').hidden=true;$('next').textContent=groupNext(current)?'לסעיף הבא ←':'השאלה הבאה ←';
 $('answers').hidden=!!current.interaction;$('submit-answer').textContent='בדיקת התשובה';$('submit-answer').hidden=!current.multiple&&!current.interaction;setupPlacement();updateSelection();if(answered)showFeedback();
}
function updateSelection(){
 if(!current.multiple)return;
 document.querySelectorAll('[data-answer]').forEach((el,i)=>{const chosen=selectedValues.includes(choices[i].value);el.className='answer multiple'+(chosen?' selected':'');el.setAttribute('aria-pressed',String(chosen));el.querySelector('.mark').textContent=chosen?'✓':'';});
 $('submit-answer').disabled=!selectedValues.length;
}
function render(question=null){current=question||chooseQuestion();if(question){seen[current.topic][current.level].add(current.id);previousId=current.id;}choices=shuffle(current.choices);answered=false;selectedValue=null;selectedValues=[];presentQuestion();saveProgress();}
function showFeedback(){
 if(current.interaction){$('placement-x').disabled=true;$('placement-y').disabled=true;paintPlacement();}
 const expected=expectedAnswers(current),ok=sameSet(selectedValues,expected),chosen=choices.find(o=>selectedValues.includes(o.value));
 document.querySelectorAll('[data-answer]').forEach((el,i)=>{el.disabled=true;if(expected.includes(choices[i].value)){el.classList.add('correct');el.querySelector('.mark').textContent='✓';}else if(selectedValues.includes(choices[i].value)){el.classList.add('wrong');el.querySelector('.mark').textContent='✕';}});
 $('result').className='result '+(ok?'good':'bad');$('result').textContent=ok?'תשובה נכונה.':'תשובה שגויה.';
 let reason=chosen?.reason||'נבדוק את הנתונים ונפתור לפי הסדר.';
 if(current.multiple){const missing=expected.some(v=>!selectedValues.includes(v)),extra=selectedValues.some(v=>!expected.includes(v));reason=(missing?'לא סומנו כל התשובות הנכונות. ':'')+(extra?'סומנו גם תשובות שגויות.':'');}
 $('mistake').textContent=ok?'':reason;$('mistake').hidden=ok;
 $('steps').innerHTML=current.steps.map(s=>'<li>'+s+'</li>').join('');$('final-answer').innerHTML=current.final;
 $('widget-title').textContent=current.illustrationTitle;$('widget-description').textContent=current.illustrationDescription;$('widget-description').hidden=!current.illustrationDescription;
 $('widget-stage').innerHTML=diagram(current.illustration);$('solution').open=!ok;$('feedback').className='feedback'+(ok?' correct-answer':'');$('navigation').className='footer-nav'+(ok?' correct-answer':'');$('feedback').hidden=false;$('navigation').hidden=false;$('submit-answer').hidden=true;
}
function gradeSelection(){
 if(answered||!selectedValues.length)return;answered=true;const ok=sameSet(selectedValues,expectedAnswers(current));
 mastery[current.topic]=Math.max(0,Math.min(6,mastery[current.topic]+(ok?1:-1.5)/(current.group?.count||1)));
 easyCorrectStreak[current.topic]=ok&&current.level==='easy'?Math.min(2,easyCorrectStreak[current.topic]+1):0;
 stats.answered++;stats.correct+=ok?1:0;stats.topics[current.topic].answered++;stats.topics[current.topic].correct+=ok?1:0;
 showFeedback();saveProgress();
}
function answer(index){
 if(answered||!choices[index])return;const value=choices[index].value;
 if(current.multiple){selectedValues=selectedValues.includes(value)?selectedValues.filter(v=>v!==value):[...selectedValues,value];selectedValue=selectedValues[0]||null;updateSelection();saveProgress();}
 else{selectedValues=[value];selectedValue=value;gradeSelection();}
}
function next(){if(!answered)return;render(groupNext(current));$('question').focus();window.scrollTo({top:0,behavior:'instant'});}
$('next').onclick=next;$('submit-answer').onclick=gradeSelection;$('solution').ontoggle=saveProgress;
if(restoreProgress()){presentQuestion();if(restoredSolutionOpen!==null)$('solution').open=restoredSolutionOpen;saveProgress();}else render();

</script>
